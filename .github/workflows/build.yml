name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git
        run: |
          git config --global user.email "ci@tumblemc.org"
          git config --global user.name "Tumble CI"

      - name: Compute build number
        id: buildnum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          count=$(gh api "repos/${{ github.repository }}/actions/runs?branch=${branch}&status=completed&exclude_pull_requests=true&per_page=1" --jq '.total_count')
          echo "value=$((count + 1))" >> "$GITHUB_OUTPUT"

      - name: Apply patches
        run: ./gradlew applyAllPatches

      - name: Build paperclip
        env:
          BUILD_NUMBER: ${{ steps.buildnum.outputs.value }}
        run: ./gradlew createPaperclipJar

      - name: Upload server JAR
        uses: actions/upload-artifact@v7
        with:
          name: Tumble-${{ steps.buildnum.outputs.value }}
          path: tumble-server/build/libs/*-paperclip-*.jar
          if-no-files-found: error
