name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Git
        run: |
          git config --global user.email "ci@tumblemc.org"
          git config --global user.name "Tumble CI"

      - name: Apply patches
        run: ./gradlew applyAllPatches

      - name: Build paperclip
        run: ./gradlew createPaperclipJar

      - name: Upload server JAR
        uses: actions/upload-artifact@v7
        with:
          name: Tumble-${{ github.run_number }}
          path: tumble-server/build/libs/*-paperclip-*.jar
          if-no-files-found: error
